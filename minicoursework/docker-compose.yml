x-airflow-common:
  &airflow-common
  image: apache/airflow:2.7.1
  networks: 
    - default
    - datahub_network  
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Ho_Chi_Minh
    - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/project/dags
    - AIRFLOW__WEBSERVER__SECRET_KEY=nhan_super_secret_key_12345
    - _PIP_ADDITIONAL_REQUIREMENTS=pyspark==3.4.1 delta-spark==2.4.0 redis pandas acryl-datahub-airflow-plugin==1.1.0.3 acryl-datahub faker s3fs trino[sqlalchemy]
  volumes:
    - ./:/opt/airflow/project 
  depends_on:
    - postgres-airflow

services:

  # ===========================================================================
  # STORAGE & MESSAGING
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: ecom-minio
    networks:
      - default
      - datahub_network
    ports:
      - "9005:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"

  redis:
    image: redis:alpine
    container_name: ecom_redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: ecom_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      # enable 'srvr' command (mặc định chỉ có srvr được bật, ruok bị tắt)
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat"
    healthcheck:
      # dùng 'srvr' thay 'ruok' vì srvr luôn được enable sẵn
      test: ["CMD", "bash", "-c", "echo srvr > /dev/tcp/localhost/2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: ecom_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ===========================================================================
  # HIVE METASTORE — lưu schema metadata cho Trino query Delta tables trên MinIO
  # ===========================================================================
  postgres-hive:
    image: postgres:13
    container_name: ecom_postgres_hive
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
      POSTGRES_DB: metastore
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: starburstdata/hive:3.1.2-e.18
    container_name: ecom_hive_metastore
    depends_on:
      postgres-hive:
        condition: service_healthy
    ports:
      - "9083:9083"
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://postgres-hive:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive123
      HIVE_METASTORE_WAREHOUSE_DIR: s3a://datalake/warehouse
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password123
      S3_PATH_STYLE_ACCESS: "true"
      REGION: us-east-1
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # TRINO — SQL query engine đọc Delta Lake qua Hive Metastore, kết nối DBeaver
  # ===========================================================================
  trino:
    image: trinodb/trino:435
    container_name: ecom_trino
    networks:
      - default
      - datahub_network
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "8085:8080"    # Trino Web UI: http://localhost:8085
                       # DBeaver JDBC:  jdbc:trino://localhost:8085
    volumes:
      - ./trino/catalog:/etc/trino/catalog        # delta.properties, hive.properties
      - ./trino/conf/jvm.config:/etc/trino/jvm.config
      - ./trino/conf/node.properties:/etc/trino/node.properties
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # AIRFLOW
  # ===========================================================================
  postgres-airflow:
    image: postgres:13
    container_name: ecom_postgres_airflow
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"

  airflow-init:
    <<: *airflow-common
    container_name: ecom_airflow_init
    command: version
    entrypoint: >
      bash -c "
      airflow db migrate &&
      airflow users create --role Admin --username admin --password admin --email admin@example.com --firstname admin --lastname admin
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: ecom_airflow_webserver
    ports:
      - "8081:8080"
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: ecom_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ===========================================================================
  # MODEL SERVING PLATFORM — Ollama OpenAI-compatible inference engine
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ecom_ollama_serving
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_storage:/root/.ollama

networks:
  datahub_network:
    external: true