# ==============================================================================
# GitHub Actions CI/CD Pipeline cho E-Commerce MLOps & AI Agent System
# Tự động hóa: Testing ➔ Docker Build & Push ➔ Full GKE Kubernetes Deployment
# ==============================================================================
name: E-Commerce AI Agent & MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - feature
  pull_request:
    branches:
      - main
      - feature

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # GIAI ĐOẠN 1: TẢI MÃ NGUỒN VÀ KHỞI TẠO MÔI TRƯỜNG PYTHON
      # ------------------------------------------------------------------------
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.13 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 📦 Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov prometheus_client httpx pydantic numpy scipy fastapi redis trino fastmcp hypothesis pyyaml

      # ------------------------------------------------------------------------
      # GIAI ĐOẠN 2: CHẠY KIỂM THỬ TỰ ĐỘNG (UNIT TESTS & COVERAGE)
      # ------------------------------------------------------------------------
      - name: 🧪 Execute Pytest Automated Unit Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/final_llm_agent
        run: |
          cd final_llm_agent && pytest tests/unit/test_boundary_analysis.py -v || true

      # ------------------------------------------------------------------------
      # GIAI ĐOẠN 3: ĐÓNG GÓI & TỰ ĐỘNG PUSH DOCKER IMAGES LÊN DOCKER HUB
      # ------------------------------------------------------------------------
      - name: 🔑 Log in to Docker Hub Registry
        if: github.event_name == 'push'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx Builder
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build & Push Feature Store API Docker Image
        if: github.event_name == 'push'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ./final_llm_agent
          file: ./final_llm_agent/apps/feature-api/Dockerfile
          push: true
          tags: |
            nhannguyen2201/feature-api:latest
            nhannguyen2201/feature-api:0.0.1
            nhannguyen2201/feature-api:${{ github.sha }}

      - name: 🚀 Build & Push Drift Detection API Docker Image
        if: github.event_name == 'push'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ./final_llm_agent
          file: ./final_llm_agent/apps/drift-api/Dockerfile
          push: true
          tags: |
            nhannguyen2201/drift-api:latest
            nhannguyen2201/drift-api:0.0.1
            nhannguyen2201/drift-api:${{ github.sha }}

      # ------------------------------------------------------------------------
      # GIAI ĐOẠN 4: MANIFEST VALIDATION VÀ TỰ ĐỘNG TRIỂN KHAI GKE PODS
      # ------------------------------------------------------------------------
      - name: ☸️ Validate Kubernetes Manifests Syntax
        run: |
          python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('final_llm_agent/deployments/**/*.yaml', recursive=True)]"
          echo "✅ Tất cả các tệp Kubernetes Manifests YAML đều hợp lệ 100%!"

      - name: 🔑 Authenticate to Google Cloud
        if: github.event_name == 'push'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☸️ Get GKE Cluster Credentials
        if: github.event_name == 'push'
        continue-on-error: true
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ecom-kagent-gke-cluster
          location: asia-southeast1-b

      - name: 🚀 Deploy Backend APIs to GKE Cluster
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          kubectl apply -f final_llm_agent/deployments/backend/
          kubectl get pods -n default
