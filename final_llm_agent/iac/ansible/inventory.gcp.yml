# ==============================================================================
# Dynamic GCP Compute Engine Inventory cho Ansible
# Tự động quét và lấy Public IP của VM ecom-data-stack-vm trên Google Cloud
# Sử dụng Google Application Default Credentials (gcloud auth)
# ==============================================================================
plugin: google.cloud.gcp_compute
projects:
  - k8s-sentiment
zones:
  - asia-southeast1-b
filters:
  - name = ecom-data-stack-vm
auth_kind: application
hostnames:
  - name
groups:
  data_stack_vm: "'ecom-data-stack-vm' in name"
compose:
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP
  ansible_user: "nhannhutnhat2201_gmail_com"
  ansible_ssh_private_key_file: "~/.ssh/google_compute_engine"
