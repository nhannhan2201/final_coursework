# ==============================================================================
# Prometheus Configuration cho E-Commerce MLOps & AI Agent System
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'feature-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['feature-api-service.default.svc.cluster.local:8000']

  - job_name: 'drift-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['drift-api-service.default.svc.cluster.local:8003']

  - job_name: 'ecom-mcp'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ecom-mcp.kagent.svc.cluster.local:8000']

  - job_name: 'drift-mcp'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['drift-mcp.kagent.svc.cluster.local:8000']

  - job_name: 'kagent-controller'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kagent-controller.kagent.svc.cluster.local:8080']
