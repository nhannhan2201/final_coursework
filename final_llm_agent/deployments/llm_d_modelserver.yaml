---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-quickstart
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-modelserver
  namespace: llm-d-quickstart
  labels:
    app: vllm-qwen3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen3
  template:
    metadata:
      labels:
        app: vllm-qwen3
    spec:
      containers:
        - name: modelserver
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-inference-gateway
  namespace: llm-d-quickstart
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 11434
      name: http
  selector:
    app: vllm-qwen3
