# ==============================================================================
# AgentgatewayPolicy cho LLM Tracing/Observability
# Thiết lập OpenTelemetry tracing cho inference requests qua AgentGateway
# ==============================================================================
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy

metadata:
  name: enable-tracing
  namespace: llm-d-quickstart

spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-d-inference-gateway

  frontend:
    tracing:
      backendRef:
        name: opentelemetry-collector
        namespace: monitoring
        port: 4317

      protocol: GRPC
      randomSampling: "1"  # 100% of requests will be traced

      attributes:
        add:
          # GenAI Semantic Conventions
          - name: gen_ai.operation.name
            expression: '"chat"'

          - name: gen_ai.system
            expression: '"llm-d"'

          - name: gen_ai.request.model
            expression: "json(request.body).model"

          - name: gen_ai.request.is_streaming
            expression: "json(request.body).stream"

          - name: gen_ai.usage.prompt_tokens
            expression: >
              string(response.body)
                .split('"prompt_tokens":')[1]
                .split(',')[0]

          - name: gen_ai.usage.total_tokens
            expression: >
              string(response.body)
                .split('"total_tokens":')[1]
                .split(',')[0]

          - name: gen_ai.usage.completion_tokens
            expression: >
              string(response.body)
                .split('"completion_tokens":')[1]
                .split('}')[0]
